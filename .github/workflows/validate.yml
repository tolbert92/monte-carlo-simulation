
name: Skill 8 - Monte Carlo Contract and Engine Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-validation:
    name: Python 3.11 - Contract and Numerical Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Display Python version
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jsonschema==4.23.0 \
            numpy==2.2.6

      - name: Verify installed dependency versions
        run: |
          python - <<'PY'
          import numpy
          import jsonschema
          from importlib.metadata import version

          assert numpy.__version__ == "2.2.6"
          assert version("jsonschema") == "4.23.0"

          print("NumPy:", numpy.__version__)
          print("jsonschema:", version("jsonschema"))
          print("Dependency version verification passed.")
          PY

      - name: Verify required repository files
        run: |
          python - <<'PY'
          from pathlib import Path

          required_files = [
              "SKILL.md",
              "README.md",
              "schemas/monte_carlo.request.v1.schema.json",
              "schemas/monte_carlo.result.v1.schema.json",
              "examples/valid-baseline-request.json",
              "examples/deterministic-reference-case.json",
              "examples/invalid-correlation-request.json",
              "examples/valid-baseline-result.json",
              "tests/test_contracts.py",
              "tests/test_return_engine.py",
              "src/monte_carlo/return_engine.py",
          ]

          missing = [
              filename
              for filename in required_files
              if not Path(filename).is_file()
          ]

          if missing:
              print("Missing required files:")
              for filename in missing:
                  print(f"  - {filename}")
              raise SystemExit(1)

          print(
              "Repository file check passed: "
              f"{len(required_files)} files found."
          )
          PY

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              list(Path("schemas").glob("*.json"))
              + list(Path("examples").glob("*.json"))
          )

          if len(files) != 6:
              raise SystemExit(
                  f"Expected 6 JSON files, found {len(files)}."
              )

          for path in files:
              with path.open(
                  "r", encoding="utf-8"
              ) as file:
                  json.load(file)

              print(f"PASS: {path}")

          print(
              "JSON syntax validation passed: "
              f"{len(files)} files."
          )
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            src/monte_carlo/return_engine.py \
            tests/test_contracts.py \
            tests/test_return_engine.py

          echo "Python syntax validation passed."

      - name: Run all contract and numerical tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee test-results.log

          if ! grep -Eq "Ran 43 tests? in " test-results.log; then
            echo "ERROR: Expected exactly 43 discovered tests."
            exit 1
          fi

          if ! grep -qx "OK" test-results.log; then
            echo "ERROR: Test suite did not report OK."
            exit 1
          fi

          echo "All 43 automated tests passed."

      - name: Write validation summary
        if: success()
        run: |
          {
            echo "## Skill #8 - Gate 2 Validation"
            echo ""
            echo "**Status:** PASSED"
            echo ""
            echo "| Validation | Result |"
            echo "|---|---|"
            echo "| Python | 3.11 |"
            echo "| NumPy | 2.2.6 |"
            echo "| jsonschema | 4.23.0 |"
            echo "| Required repository files | 11 verified |"
            echo "| JSON syntax | 6 files passed |"
            echo "| Python syntax | 3 files passed |"
            echo "| Gate 1 contract tests | 23 |"
            echo "| Gate 2 numerical tests | 20 |"
            echo "| **Total automated tests** | **43 passed** |"
            echo ""
            echo "### Scope"
            echo ""
            echo "Validated:"
            echo "- Versioned JSON contracts and fixtures"
            echo "- Portfolio and correlation semantic checks"
            echo "- Seeded return reproducibility"
            echo "- Correlated multivariate normal returns"
            echo "- Lognormal return conversion"
            echo "- Covariance and positive-semidefinite checks"
            echo "- Deterministic reference return generation"
            echo ""
            echo "Not yet validated:"
            echo "- Portfolio balance evolution"
            echo "- Contributions, withdrawals, and rebalancing"
            echo "- Full Monte Carlo financial risk reporting"
            echo "- Additional return models"
            echo "- Hosted professor acceptance testing"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-test-failure-log
          path: test-results.log
          if-no-files-found: ignore
          retention-days: 14
