
name: Skill 8 - Monte Carlo Contract and Engine Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-validation:
    name: Python 3.11 - Contract and Numerical Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Display Python version
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jsonschema==4.23.0 \
            numpy==2.2.6

      - name: Verify installed dependency versions
        run: |
          python - <<'PY'
          import numpy
          from importlib.metadata import version

          assert numpy.__version__ == "2.2.6"
          assert version("jsonschema") == "4.23.0"

          print("NumPy:", numpy.__version__)
          print("jsonschema:", version("jsonschema"))
          print("Dependency version verification passed.")
          PY

      - name: Verify required repository files
        run: |
          python - <<'PY'
          from pathlib import Path

          required_files = [
              "SKILL.md",
              "README.md",
              "schemas/monte_carlo.request.v1.schema.json",
              "schemas/monte_carlo.result.v1.schema.json",
              "examples/valid-baseline-request.json",
              "examples/deterministic-reference-case.json",
              "examples/invalid-correlation-request.json",
              "examples/valid-baseline-result.json",
              "tests/test_contracts.py",
              "tests/test_return_engine.py",
              "tests/test_portfolio_engine.py",
              "src/monte_carlo/return_engine.py",
              "src/monte_carlo/portfolio_engine.py",
          ]

          missing = [
              filename
              for filename in required_files
              if not Path(filename).is_file()
          ]

          if missing:
              print("Missing required files:")
              for filename in missing:
                  print(f"  - {filename}")
              raise SystemExit(1)

          print(
              "Repository file check passed: "
              f"{len(required_files)} files found."
          )
          PY

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              list(Path("schemas").glob("*.json"))
              + list(Path("examples").glob("*.json"))
          )

          if len(files) != 6:
              raise SystemExit(
                  f"Expected 6 JSON files, found {len(files)}."
              )

          for path in files:
              with path.open(
                  "r", encoding="utf-8"
              ) as file:
                  json.load(file)

              print(f"PASS: {path}")

          print(
              "JSON syntax validation passed: "
              f"{len(files)} files."
          )
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            src/monte_carlo/return_engine.py \
            src/monte_carlo/portfolio_engine.py \
            tests/test_contracts.py \
            tests/test_return_engine.py \
            tests/test_portfolio_engine.py

          echo "Python syntax validation passed."

      - name: Run all 67 contract and numerical tests
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v 2>&1 | tee test-results.log

          python - <<'PY'
          import re
          from pathlib import Path

          output = Path(
              "test-results.log"
          ).read_text(encoding="utf-8")

          matches = re.findall(
              r"^Ran (\d+) tests? in ",
              output,
              flags=re.MULTILINE,
          )

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Could not identify exactly one "
                  "unittest summary."
              )

          actual_count = int(matches[0])
          expected_count = 67

          print(
              f"Discovered tests: {actual_count}"
          )

          if actual_count != expected_count:
              raise SystemExit(
                  f"ERROR: Expected {expected_count} tests, "
                  f"but discovered {actual_count}."
              )

          if not re.search(
              r"^OK\s*$",
              output,
              flags=re.MULTILINE,
          ):
              raise SystemExit(
                  "ERROR: Test suite did not report OK."
              )

          print(
              "All 67 automated tests passed."
          )
          PY

      - name: Write validation summary
        if: success()
        run: |
          {
            echo "## Skill #8 - Gate 2 Validation"
            echo ""
            echo "**Status: PASSED**"
            echo ""
            echo "| Validation | Result |"
            echo "|---|---|"
            echo "| Python | 3.11 |"
            echo "| NumPy | 2.2.6 |"
            echo "| jsonschema | 4.23.0 |"
            echo "| Required repository files | 13 verified |"
            echo "| JSON syntax | 6 files passed |"
            echo "| Python syntax | 5 files passed |"
            echo "| Gate 1 contract tests | 23 passed |"
            echo "| Gate 2 return-engine tests | 20 passed |"
            echo "| Gate 2 portfolio-engine tests | 24 passed |"
            echo "| **Total automated tests** | **67 passed** |"
            echo ""
            echo "### Validated capabilities"
            echo ""
            echo "- Versioned JSON contracts and fixtures"
            echo "- Request and result semantic validation"
            echo "- Seeded return reproducibility"
            echo "- Correlated multivariate normal returns"
            echo "- Lognormal return conversion"
            echo "- Covariance and positive-semidefinite checks"
            echo "- Deterministic return generation"
            echo "- Multi-asset portfolio balance evolution"
            echo "- Beginning- and end-of-period cash flows"
            echo "- Contribution and withdrawal accounting"
            echo "- Withdrawal shortfall tracking"
            echo "- Periodic fee calculations"
            echo "- Asset allocation drift without rebalancing"
            echo "- Portfolio depletion and recovery"
            echo "- Path-by-path accounting reconciliation"
            echo ""
            echo "### Not yet validated"
            echo ""
            echo "- Intraperiod depletion event tracking"
            echo "- Scheduled and threshold rebalancing"
            echo "- Tax-aware account mechanics"
            echo "- Inflation-adjusted cash flows"
            echo "- Student's t and bootstrap return models"
            echo "- Regime-switching simulations"
            echo "- Full financial risk and goal reporting"
            echo "- Hosted professor acceptance testing"
            echo ""
            echo "### Acceptance boundary"
            echo ""
            echo "This workflow validates the current "
            echo "contract, return-generation, and portfolio "
            echo "accounting foundations. It does not approve "
            echo "the complete Monte Carlo application."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-test-failure-log
          path: test-results.log
          if-no-files-found: ignore
          retention-days: 14
