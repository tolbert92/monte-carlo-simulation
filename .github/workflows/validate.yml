
name: Skill 8 - Monte Carlo Contract Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-validation:
    name: Python 3.11 - Contract and Semantic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jsonschema==4.23.0 \
            numpy==2.2.6

      - name: Verify required repository files
        run: |
          python - <<'PY'
          from pathlib import Path

          required_files = [
              "SKILL.md",
              "README.md",
              "schemas/monte_carlo.request.v1.schema.json",
              "schemas/monte_carlo.result.v1.schema.json",
              "examples/valid-baseline-request.json",
              "examples/deterministic-reference-case.json",
              "examples/invalid-correlation-request.json",
              "examples/valid-baseline-result.json",
              "tests/test_contracts.py",
          ]

          missing = [
              filename
              for filename in required_files
              if not Path(filename).is_file()
          ]

          if missing:
              print("Missing required files:")
              for filename in missing:
                  print(f"  - {filename}")
              raise SystemExit(1)

          print(
              f"Repository file check passed: "
              f"{len(required_files)} files found."
          )
          PY

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              list(Path("schemas").glob("*.json"))
              + list(Path("examples").glob("*.json"))
          )

          if len(files) != 6:
              raise SystemExit(
                  f"Expected 6 JSON files, found {len(files)}."
              )

          for path in files:
              with path.open(
                  "r", encoding="utf-8"
              ) as file:
                  json.load(file)

              print(f"PASS: {path}")

          print(
              f"JSON syntax validation passed: "
              f"{len(files)} files."
          )
          PY

      - name: Run contract and semantic tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_contracts.py" \
            -v

      - name: Write workflow summary
        if: success()
        run: |
          {
            echo "## Skill #8 - Gate 1 Validation"
            echo ""
            echo "**Status:** PASSED"
            echo ""
            echo "- Python: 3.11"
            echo "- Required repository files: 9"
            echo "- JSON files checked: 6"
            echo "- Contract and semantic tests: 23"
            echo ""
            echo "This workflow verifies contracts and fixtures."
            echo "It does not verify the Monte Carlo engine."
          } >> "$GITHUB_STEP_SUMMARY"
